<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visit and Workshops | Northline Rehab</title><meta name="description" content="Visit Northline Rehab in Clarksville, TN, hours, workshops, FAQs, and the Recovery Letter.">
<meta property="og:title" content="Visit and Workshops | Northline Rehab"><meta property="og:description" content="Visit Northline Rehab in Clarksville, TN, hours, workshops, FAQs, and the Recovery Letter."><meta property="og:type" content="website"><meta property="og:image" content="og-image.png"><meta property="og:url" content="https://brittanynation.github.io/northline-rehab/">
<link rel="stylesheet" href="styles.css"><script src="data.js"></script></head><body>
<header><div class="brand">Northline Rehab</div><nav><a href="index.html">Programs</a><a href="book.html">Book and Checkout</a><a href="visit.html">Visit and Workshops</a> <button class="btn gold" id="basketBtn">Plan (<span id="basketCount">0</span>)</button></nav></header>
<section><h1>Visit us</h1><img src="images/p6111588.jpg" alt="Therapist working with a patient" style="max-width:100%;border-radius:12px">
<h2>Hours</h2><table id="hoursTable"><tr><th>Day</th><th>Hours</th></tr></table>
<h2>Workshops</h2><div id="workshops"></div>
<form id="rsvpForm" novalidate><h3>Reserve a workshop seat</h3><label>Workshop</label><select id="rWs"></select><label>Name</label><input id="rName"><div class="err" id="reName"></div><label>Email</label><input id="rEmail"><div class="err" id="reEmail"></div><label>Date</label><input id="rDate" type="date"><div class="err" id="reDate"></div><button class="btn" type="submit">Reserve seat</button></form><div id="rsvpOut"></div>
<h2>FAQs</h2><div id="faqs"></div>
<h2>The Recovery Letter</h2><p>One short recovery tip each Sunday. No spam.</p><form id="newsForm" novalidate><label>Email</label><input id="nEmail" type="email"><div class="err" id="neEmail"></div><button class="btn secondary" type="submit">Sign up</button></form><div id="newsOut"></div></section>
<aside class="drawer" id="drawer"><h2>Your Plan</h2><div id="drawerItems"></div><p id="drawerTotal"></p><a href="book.html"><button class="btn">Go to checkout</button></a> <button class="btn secondary" id="closeDrawer">Close</button></aside>
<script>document.getElementById('basketBtn').addEventListener('click',()=>{renderDrawer();document.getElementById('drawer').classList.add('open')});document.getElementById('closeDrawer').addEventListener('click',()=>document.getElementById('drawer').classList.remove('open'));
function renderDrawer(){const b=getBasket();const w=document.getElementById('drawerItems');if(!b.length){w.innerHTML='<p>Your plan is empty.</p>';document.getElementById('drawerTotal').textContent='';return;}let total=0;w.innerHTML=b.map((i,idx)=>{const p=PROGRAMS.find(x=>x.id===i.id);const pr=packPrice(p,i.pack)*i.qty;total+=pr;return `<div><strong>${p.name}</strong><br>Pack of ${i.pack} · ${money(packPrice(p,i.pack))} <button onclick="changeQty(${idx},-1)">-</button> ${i.qty} <button onclick="changeQty(${idx},1)">+</button> <button onclick="removeItem(${idx})">Remove</button><br>${money(pr)}</div><hr>`}).join('');document.getElementById('drawerTotal').textContent='Subtotal '+money(total);}
function changeQty(idx,d){const b=getBasket();b[idx].qty+=d;if(b[idx].qty<1)b.splice(idx,1);setBasket(b);renderDrawer();if(typeof renderCheckout==='function')renderCheckout();}
function removeItem(idx){const b=getBasket();b.splice(idx,1);setBasket(b);renderDrawer();if(typeof renderCheckout==='function')renderCheckout();}
updateBasketCount();</script>
<script>
const HOURS=[["Sunday","Closed"],["Monday","7 AM to 6 PM"],["Tuesday","7 AM to 6 PM"],["Wednesday","7 AM to 6 PM"],["Thursday","7 AM to 6 PM"],["Friday","7 AM to 5 PM"],["Saturday","8 AM to 12 PM"]];
const todayIdx=new Date().getDay();document.getElementById("hoursTable").innerHTML="<tr><th>Day</th><th>Hours</th></tr>"+HOURS.map((h,i)=>`<tr class="${i===todayIdx?"today":""}"><td>${h[0]}</td><td>${h[1]}</td></tr>`).join("");
const WS=[{id:"w1",name:"Stronger Steps at Home",day:2,dayName:"Tuesday",seats:8,desc:"Home balance and strength practice you can do in a hallway."},{id:"w2",name:"Back Care Basics",day:4,dayName:"Thursday",seats:7,desc:"Plain word back care, lifting practice, and a take home plan."}];
function getSeats(){return JSON.parse(localStorage.getItem("nr_seats")||"{}");}
function drawWs(){const s=getSeats();document.getElementById("workshops").innerHTML=WS.map(w=>`<div class="card"><h3>${w.name}</h3><p>Every ${w.dayName} · ${s[w.id]!==undefined?s[w.id]:w.seats} seats left</p><p>${w.desc}</p></div>`).join("");document.getElementById("rWs").innerHTML=WS.map(w=>`<option value="${w.id}">${w.name} (${w.dayName}s)</option>`).join("");}
drawWs();
document.getElementById("rsvpForm").addEventListener("submit",e=>{e.preventDefault();const w=WS.find(x=>x.id===document.getElementById("rWs").value);let ok=true;
document.getElementById("reName").textContent=document.getElementById("rName").value.trim().length>=2?"":"Enter your name.";if(document.getElementById("reName").textContent)ok=false;
document.getElementById("reEmail").textContent=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById("rEmail").value)?"":"Enter a valid email.";if(document.getElementById("reEmail").textContent)ok=false;
const dv=document.getElementById("rDate").value;let dm="";if(!dv)dm="Pick a date.";else{const d=new Date(dv+"T12:00:00");if(d<new Date(new Date().toDateString()))dm="That date is in the past.";else if(d.getDay()!==w.day)dm=w.name+" runs on "+w.dayName+"s.";}document.getElementById("reDate").textContent=dm;if(dm)ok=false;if(!ok)return;
const s=getSeats();const left=(s[w.id]!==undefined?s[w.id]:w.seats);if(left<1){document.getElementById("rsvpOut").textContent="That workshop is full.";return;}s[w.id]=left-1;localStorage.setItem("nr_seats",JSON.stringify(s));const ref="NR-R-"+Math.random().toString(36).slice(2,7).toUpperCase();document.getElementById("rsvpOut").innerHTML=`<div class="success">Seat reserved. Your reference is <strong>${ref}</strong> for ${w.name}.</div>`;drawWs();});
const FAQS=[["Do I need a referral?","No. You can book directly, and we share notes with your doctor if you ask us to."],["What should I wear?","Comfortable clothes you can move in, and flat shoes."],["How many sessions will I need?","Your therapist sets a plan at the first visit and reviews it every two weeks."],["Do you take insurance?","We list pack prices in the open on this demo site. In a real clinic, coverage varies by plan."],["Can I cancel a pack?","Unused sessions in a pack can be paused in this demo flow from your plan."],["Where do I park?","Free parking is beside the studio, with step free entry." ]];
document.getElementById("faqs").innerHTML=FAQS.map(f=>`<div class="faq"><button type="button">${f[0]}</button><div><p>${f[1]}</p></div></div>`).join("");
document.querySelectorAll(".faq button").forEach(b=>b.addEventListener("click",()=>{const box=b.parentElement;const was=box.classList.contains("open");document.querySelectorAll(".faq").forEach(x=>x.classList.remove("open"));if(!was)box.classList.add("open");}));
document.getElementById("newsForm").addEventListener("submit",e=>{e.preventDefault();const em=document.getElementById("nEmail").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){document.getElementById("neEmail").textContent="Enter a valid email.";return;}document.getElementById("neEmail").textContent="";const list=JSON.parse(localStorage.getItem("nr_news")||"[]");if(list.includes(em)){document.getElementById("newsOut").textContent="You are already on the Recovery Letter list.";return;}list.push(em);localStorage.setItem("nr_news",JSON.stringify(list));document.getElementById("newsOut").innerHTML="<div class='success'>You are on the list. Welcome.</div>";});
</script><footer>Northline Rehab is a fictional portfolio concept.</footer></body></html>
